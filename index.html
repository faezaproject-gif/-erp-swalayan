<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0b1f33"><title>ERP Swalayan V23</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f6f9;color:#17202a}header{background:#0b1f33;color:#fff;padding:18px 16px;position:sticky;top:0;z-index:5}h1{font-size:20px;margin:0 0 4px}.small{opacity:.75;font-size:12px}.wrap{padding:14px 14px 88px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:#fff;border-radius:14px;padding:15px;box-shadow:0 2px 10px #0001;margin-bottom:10px}.kpi b{display:block;font-size:21px;margin-top:5px}.kpi span{font-size:12px;color:#6b7785}.menu{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.btn{border:0;border-radius:12px;padding:14px;background:#fff;text-align:left;box-shadow:0 2px 8px #0001;font-weight:700}.btn small{display:block;color:#718096;margin-top:4px;font-weight:400}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:flex;z-index:9}.nav button{flex:1;border:0;background:none;padding:11px 3px;font-size:11px}.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.login .card{width:100%;max-width:390px}.input{width:100%;padding:13px;border:1px solid #ccd5df;border-radius:10px;margin:6px 0 10px}.primary{background:#1565c0;color:#fff;border:0;border-radius:10px;padding:13px;width:100%;font-weight:700}.receipt{font-family:monospace;font-size:12px;background:#fff;padding:12px;width:80mm;max-width:100%;margin:auto}.row{display:flex;justify-content:space-between;margin:6px 0}.scan{background:#fff7e6;border:1px solid #ffd591}.tag{display:inline-block;padding:4px 8px;border-radius:99px;background:#e7f1ff;color:#145ea8;font-size:11px}
</style></head><body><div id="app"></div>
<script>
const roles={
 owner:['Dashboard','POS/Kasir','Produk & Stok','Purchasing','Supplier','Kas & Bank','Piutang','Hutang','Akuntansi','Member','HR & Payroll','Laporan','Pengaturan'],
 manager:['Dashboard','POS/Kasir','Produk & Stok','Purchasing','Supplier','Kas & Bank','Piutang','Hutang','Laporan'],
 kasir:['Dashboard','POS/Kasir','Member'],
 gudang:['Dashboard','Produk & Stok','Purchasing','Supplier']
};
let user=localStorage.getItem('erpUser')||'';
let products=JSON.parse(localStorage.getItem('erpProducts')||'null')||[
 {n:'Beras Premium 5kg',p:72000,s:24,b:'89900001'},
 {n:'Minyak Goreng 1L',p:18000,s:45,b:'89900002'},
 {n:'Gula Pasir 1kg',p:17500,s:31,b:'89900003'}
];
let cart=[];
const app=document.getElementById('app');
function login(){app.innerHTML=`<div class="login"><div class="card"><h1>ERP Swalayan V23</h1><p class="small">Aplikasi Android • Mode lokal</p><input id="u" class="input" placeholder="owner / manager / kasir / gudang"><input id="pw" class="input" type="password" placeholder="Password: 1234"><button class="primary" onclick="doLogin()">Masuk</button><p class="small">Demo: semua password <b>1234</b></p></div></div>`}
function doLogin(){const x=document.getElementById('u').value.toLowerCase().trim();const pw=document.getElementById('pw').value;if(!roles[x])return alert('Gunakan owner, manager, kasir, atau gudang');if(pw!=='1234')return alert('Password demo: 1234');user=x;localStorage.setItem('erpUser',x);home()}
function home(){const menu=roles[user]||roles.Owner;app.innerHTML=`<header><h1>ERP Swalayan</h1><div class="small">${user.toUpperCase()} • Cabang Utama</div></header><main class="wrap"><div class="grid"><div class="card kpi"><span>Omzet Hari Ini</span><b>Rp 12,48 jt</b></div><div class="card kpi"><span>Transaksi</span><b>186</b></div><div class="card kpi"><span>Nilai Stok</span><b>Rp 348 jt</b></div><div class="card kpi"><span>Kas</span><b>Rp 26,4 jt</b></div></div><div class="card"><b>Dashboard</b><p class="small">Ringkasan operasional toko</p><div class="row"><span>Penjualan</span><b>+12,4%</b></div><div class="row"><span>Stok menipis</span><b>7 item</b></div><div class="row"><span>Piutang jatuh tempo</span><b>Rp 4,2 jt</b></div></div><h3>Menu</h3><div class="menu">${menu.map(m=>`<button class="btn" onclick="page('${m.replaceAll("'","\\'")}')">${m}<small>Buka modul</small></button>`).join('')}</div></main><nav class="nav"><button onclick="home()">⌂<br>Home</button><button onclick="page('POS/Kasir')">▣<br>Kasir</button><button onclick="page('Produk & Stok')">▤<br>Stok</button><button onclick="page('Laporan')">▥<br>Laporan</button><button onclick="logout()">↪<br>Keluar</button></nav>`}
function page(m){if(m==='POS/Kasir')return pos();if(m==='Produk & Stok')return stock();if(m==='Laporan')return simple('Laporan','Penjualan harian, laba rugi, arus kas, stok, hutang, piutang dan laporan cabang.');if(m==='Member')return simple('Member & Pelanggan','Data member, tier harga, promo dan riwayat transaksi.');return simple(m,'Modul '+m+' tersedia dalam paket ERP V23. Mode ini menggunakan penyimpanan lokal demo.')}
function simple(t,d){app.innerHTML=`<header><h1>${t}</h1><div class="small">ERP Swalayan V23</div></header><main class="wrap"><div class="card"><span class="tag">${user.toUpperCase()}</span><h3>${t}</h3><p>${d}</p><button class="primary" onclick="home()">Kembali ke Dashboard</button></div></main><nav class="nav"><button onclick="home()">⌂<br>Home</button><button onclick="logout()">↪<br>Keluar</button></nav>`}
function pos(){app.innerHTML=`<header><h1>POS / Kasir</h1><div class="small">Scan barcode atau input manual</div></header><main class="wrap"><div class="card scan"><b>📷 Scanner HP</b><p class="small">Gunakan input manual jika scanner otomatis belum didukung WebView.</p><button class="primary" onclick="scan()">Mulai Scan</button></div><div class="card"><input id="bc" class="input" placeholder="Barcode produk"><button class="primary" onclick="addBarcode()">Tambah ke Nota</button></div><div class="card"><h3>Nota Sementara</h3><div id="cart"></div><button class="primary" onclick="printReceipt()">Cetak Nota 80mm</button></div></main><nav class="nav"><button onclick="home()">⌂<br>Home</button><button onclick="pos()">▣<br>Kasir</button></nav>`;renderCart()}
function addBarcode(){const value=document.getElementById('bc').value.trim();const p=products.find(x=>x.b===value);if(!p)return alert('Barcode tidak ditemukan');cart.push(p);renderCart();document.getElementById('bc').value=''}
function renderCart(){const el=document.getElementById('cart');if(!el)return;el.innerHTML=cart.length?cart.map(x=>`<div class="row"><span>${x.n}</span><b>Rp ${x.p.toLocaleString('id-ID')}</b></div>`).join(''):'<span class="small">Belum ada barang</span>'}
async function scan(){if(!('BarcodeDetector' in window))return alert('Scanner otomatis belum didukung WebView ini. Gunakan input barcode manual atau scanner Bluetooth.');alert('BarcodeDetector tersedia. Implementasi kamera scanner dapat ditambahkan pada tahap berikutnya.')}
function printReceipt(){const total=cart.reduce((a,x)=>a+x.p,0);const w=window.open('','_blank');if(!w)return alert('Izinkan jendela cetak terlebih dahulu');const lines=cart.map(x=>`<div class="row"><span>${x.n}</span><span>Rp ${x.p.toLocaleString('id-ID')}</span></div>`).join('');const html=`<div class="receipt"><h3 style="text-align:center">ERP SWALAYAN</h3><div style="text-align:center">CABANG UTAMA</div><hr>${lines}<hr><div class="row"><b>TOTAL</b><b>Rp ${total.toLocaleString('id-ID')}</b></div><p style="text-align:center">Terima kasih</p></div>`;w.document.open();w.document.write(`<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nota ERP Swalayan</title><style>@page{size:80mm auto;margin:3mm}body{font-family:monospace;font-size:12px;margin:0}.receipt{width:80mm;max-width:100%}.row{display:flex;justify-content:space-between;margin:6px 0}</style></head><body>${html}</body></html>`);w.document.close();setTimeout(()=>w.print(),300)}
function stock(){app.innerHTML=`<header><h1>Produk & Stok</h1><div class="small">ERP Swalayan V23</div></header><main class="wrap">${products.map(x=>`<div class="card"><b>${x.n}</b><div class="row"><span>Barcode ${x.b}</span><b>Stok ${x.s}</b></div><div>Rp ${x.p.toLocaleString('id-ID')}</div></div>`).join('')}<button class="primary" onclick="home()">Kembali</button></main><nav class="nav"><button onclick="home()">⌂<br>Home</button><button onclick="stock()">▤<br>Stok</button></nav>`}
function logout(){localStorage.removeItem('erpUser');user='';cart=[];login()}
user?home():login();
</script></body></html>
